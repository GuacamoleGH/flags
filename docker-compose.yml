services:
  flags:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guacamolegh-flags
    restart: unless-stopped
    ports:
      - "${PORT:-3095}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/flags.db
      - JWT_SECRET=${JWT_SECRET:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
